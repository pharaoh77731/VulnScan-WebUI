version: "3.8"

services:
  vulnscan-pro:
    build: .
    ports:
      - "5000:5000"
    environment:
      - VULNSCAN_API_KEY=${VULNSCAN_API_KEY:-change-this-in-production}
      - PORT=5000
      - FLASK_DEBUG=false
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
